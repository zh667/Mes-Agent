name: CI

on:
  push:
    branches:
      - main
      - feature/**
      - codex/**
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore MesCopilot.sln

      - name: Build
        run: dotnet build MesCopilot.sln --configuration Release --no-restore

      - name: Unit tests with core coverage
        run: >-
          dotnet test tests/MesCopilot.UnitTests/MesCopilot.UnitTests.csproj
          --configuration Release --no-build
          --collect:"XPlat Code Coverage"
          --settings tests/MesCopilot.UnitTests/coverage.runsettings
          --results-directory artifacts/coverage

      - name: Enforce core coverage threshold
        shell: pwsh
        run: ./scripts/check-core-coverage.ps1 -CoverageDirectory artifacts/coverage -MinimumPercent 70

      - name: Integration tests
        run: dotnet test tests/MesCopilot.IntegrationTests/MesCopilot.IntegrationTests.csproj --configuration Release --no-build

      - name: Short performance baselines
        run: dotnet run --project tests/MesCopilot.Benchmarks/MesCopilot.Benchmarks.csproj --configuration Release --no-build -- --job short --filter "*"

      - name: Format check
        run: dotnet format MesCopilot.sln --verify-no-changes --no-restore

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Check localization catalogs and UI copy
        run: pnpm check:i18n

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
